name: Deploy G Messenger Firebase

on:
  workflow_dispatch:
  push:
    branches:
      - v27-final
    paths:
      - 'firebase.json'
      - 'firebase.rules.json'
      - 'functions/**'
      - '.github/workflows/firebase-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Restore Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "ERROR: Add FIREBASE_SERVICE_ACCOUNT_JSON GitHub Secret" && exit 1)
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Realtime Database rules and Functions
        run: firebase deploy --project g-messenger-10d39 --only database,functions --non-interactive
