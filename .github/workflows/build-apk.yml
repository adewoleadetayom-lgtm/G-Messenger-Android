name: Build G Messenger v24 APK
on:
  push:
    branches: [ main, 'v*-final' ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G-Messenger-v24-debug
          path: app/build/outputs/apk/debug/app-debug.apk
