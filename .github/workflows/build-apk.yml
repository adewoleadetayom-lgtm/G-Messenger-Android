name: Build G Messenger v23 APK

on:
  push:
    branches:
      - v23-final
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -L -o gradle.zip https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build G Messenger v23
        run: |
          gradle --no-daemon clean :app:assembleDebug

      - name: Upload G Messenger v23 APK
        uses: actions/upload-artifact@v4
        with:
          name: G-Messenger-v23-debug
          path: app/build/outputs/apk/debug/app-debug.apk
