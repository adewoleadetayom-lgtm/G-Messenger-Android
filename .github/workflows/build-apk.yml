name: Build G Messenger v27 APK

on:
  push:
    branches:
      - v27-final
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > app/google-services.json
            echo "google-services.json restored from GitHub Secret"
          elif [ -f app/google-services.json ]; then
            echo "google-services.json already exists in repository"
          else
            echo "ERROR: Add GOOGLE_SERVICES_JSON_B64 as a GitHub Actions secret."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Validate Firebase rules JSON
        run: python3 -m json.tool firebase.rules.json >/dev/null

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --ignore-scripts

      - name: Validate Cloud Functions JavaScript
        run: node --check functions/index.js

      - name: Show debug signing SHA-1
        run: |
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA-256:"

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: G-Messenger-v27-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
