<script>
const K='gm25_';
// v21 account isolation: each registered profile gets its own contact and chat storage.
(function migrateLegacy(){
  const legacy=['gm20_','gm19_','gm18_'];
  ['profile','verified','groups','communities','channels','statuses','calls','tab','dark','registeredUsers'].forEach(k=>{
    if(localStorage.getItem(K+k)===null){
      for(const old of legacy){const v=localStorage.getItem(old+k);if(v!==null){localStorage.setItem(K+k,v);break}}
    }
  });
})();
let tab=localStorage.getItem(K+'tab')||'chats';
let profile=JSON.parse(localStorage.getItem(K+'profile')||'null');
let verified=localStorage.getItem(K+'verified')==='1';
let groups=JSON.parse(localStorage.getItem(K+'groups')||'[]');
let communities=JSON.parse(localStorage.getItem(K+'communities')||'[]');
let channels=JSON.parse(localStorage.getItem(K+'channels')||'[]');
let statuses=JSON.parse(localStorage.getItem(K+'statuses')||'[]');
let calls=JSON.parse(localStorage.getItem(K+'calls')||'[]');
let registeredUsers=JSON.parse(localStorage.getItem(K+'registeredUsers')||'[]');
let dark=localStorage.getItem(K+'dark')==='1'; if(dark)document.body.classList.add('dark');
function normalizePhone(p){return String(p||'').replace(/\D/g,'')}
function accountStorageKey(p){const phone=normalizePhone(p?.phone);if(phone)return phone;return String(p?.id||'guest').trim().toLowerCase().replace(/[^a-z0-9_-]/g,'_')}
function legacyValue(name){for(const old of ['gm20_','gm19_','gm18_']){const v=localStorage.getItem(old+name);if(v!==null)return v}return null}
let accountKey=profile?accountStorageKey(profile):'';
const GLOBAL_CHAT_KEY='global_g_messenger';
const GLOBAL_ADMIN_IDS=['gm_goodluck'];
let contacts=[],chats=[];
function loadAccountData(allowLegacy=false){
  accountKey=profile?accountStorageKey(profile):'';
  if(!accountKey){contacts=[];chats=[];return}
  const ck=K+'contacts_'+accountKey, hk=K+'chats_'+accountKey;
  let cv=localStorage.getItem(ck), hv=localStorage.getItem(hk);
  if(cv===null && allowLegacy) cv=legacyValue('contacts');
  if(hv===null && allowLegacy) hv=legacyValue('chats');
  contacts=cv?JSON.parse(cv):[]; chats=hv?JSON.parse(hv):[];
  contacts=contacts.map(c=>({...c,registered:c.registered===true}));
}
loadAccountData(!!profile);
function ensureGeneralGMessengerChat(){
  if(!profile||!verified)return -1;
  let idx=chats.findIndex(c=>c.global===true||c.contactKey===GLOBAL_CHAT_KEY);
  if(idx<0){
    chats.unshift({global:true,contactKey:GLOBAL_CHAT_KEY,name:'G Messenger',phone:'',photo:'',messages:[]});
    save(); idx=0;
  } else {
    chats[idx].global=true; chats[idx].contactKey=GLOBAL_CHAT_KEY; chats[idx].name='G Messenger';
  }
  return idx;
}
function save(){
  localStorage.setItem(K+'profile',JSON.stringify(profile));
  localStorage.setItem(K+'verified',verified?'1':'0');
  if(profile){localStorage.setItem(K+'contacts_'+accountStorageKey(profile),JSON.stringify(contacts));localStorage.setItem(K+'chats_'+accountStorageKey(profile),JSON.stringify(chats))}
  localStorage.setItem(K+'groups',JSON.stringify(groups));localStorage.setItem(K+'communities',JSON.stringify(communities));localStorage.setItem(K+'channels',JSON.stringify(channels));localStorage.setItem(K+'statuses',JSON.stringify(statuses));localStorage.setItem(K+'calls',JSON.stringify(calls));localStorage.setItem(K+'registeredUsers',JSON.stringify(registeredUsers));localStorage.setItem(K+'tab',tab);localStorage.setItem(K+'dark',dark?'1':'0')
}
function registeredByPhone(p){const n=normalizePhone(p);return registeredUsers.find(u=>normalizePhone(u.phone)===n)||null}
function registeredById(id){const x=String(id||'').trim().toLowerCase();return x?registeredUsers.find(u=>String(u.id||'').trim().toLowerCase()===x)||null:null}
function syncCurrentUserToRegistry(){if(!profile||!profile.phone)return;const u={id:profile.id||'',phone:profile.phone||'',name:profile.name||'G Messenger user',photo:profile.photo||''};const ex=registeredByPhone(u.phone)||registeredById(u.id);if(ex)Object.assign(ex,u);else registeredUsers.push(u);save()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1600)}
function av(name,photo=''){return `<div class="av">${photo?`<img src="${photo}">`:esc((name||'?').slice(0,1).toUpperCase())}</div>`}
function nav(){return `<div class="bottom"><button class="tab ${tab==='chats'?'active':''}" onclick="setTab('chats')"><span class="i">▤</span>Chats</button><button class="tab ${tab==='updates'?'active':''}" onclick="setTab('updates')"><span class="i">◉</span>Updates</button><button class="tab ${tab==='communities'?'active':''}" onclick="setTab('communities')"><span class="i">♧</span>Communities</button><button class="tab ${tab==='calls'?'active':''}" onclick="setTab('calls')"><span class="i">☎</span>Calls</button></div>`}
function header(title='G Messenger',showAI=true){return `<div class="header"><div class="brand">${esc(title)}</div>${showAI?'<button class="headbtn" onclick="openGemma()">✦</button>':''}<button class="headbtn" onclick="openSettings()">⋮</button></div>`}
function setTab(t){tab=t;render()}
function render(){if(!profile||!verified){showRegistration();return}ensureGeneralGMessengerChat();document.getElementById('app').innerHTML=tab==='chats'?chatsView():tab==='updates'?updatesView():tab==='communities'?communitiesView():callsView()}
function chatsView(){const ordered=[...chats].sort((a,b)=>(a.global? -1:0)-(b.global? -1:0));const rows=ordered.map(c=>{const i=chats.indexOf(c),m=c.messages.at(-1)||{};const subtitle=c.global?(m.text||'Official messages from G Messenger'): (m.text||'Tap to start chatting');return `<div class="row" onclick="openChat(${i})">${av(c.name,c.photo)}<div class="grow"><div class="name">${esc(c.name)}${c.global?' <span class="badge" style="display:inline-flex;margin-left:5px;width:18px;height:18px">✓</span>':''}</div><div class="sub">${esc(subtitle)}</div></div><div class="time">${m.time||''}</div></div>`}).join('');return `<div class="app">${header()}<div class="search">⌕<input placeholder="Search or ask Gemma AI" oninput="filterChats(this.value)"></div><div class="filters"><button class="pill active">All</button><button class="pill">Unread</button><button class="pill">Groups</button><button class="pill">Favorites</button><button class="pill" onclick="newChat()">＋</button></div><div id="chatRows" class="list">${rows||'<div class="center" style="padding:45px 20px;color:var(--muted)">No chats yet.<br>Add a contact and start a new chat.</div>'}</div><button class="fab" onclick="newChat()">＋</button>${nav()}</div>`}
function filterChats(q){document.querySelectorAll('#chatRows .row').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q.toLowerCase())?'flex':'none')}
function newChat(){const registeredContacts=contacts.filter(c=>c.registered);modal(`<h2>New chat <button class="x" onclick="closeModal()">✕</button></h2><div class="card"><b>G Messenger General</b><div class="sub">The official group is automatically available to every verified user.</div></div><div class="card"><b>Start a chat</b><div class="sub">Only people registered on G Messenger can be added to chats. Unregistered contacts can be invited.</div></div><div class="contactRow">${av(profile.name,profile.photo)}<div class="grow"><div class="name">You</div><div class="sub">Message yourself</div></div><button class="smallBtn" onclick="startSelfChat()">Chat</button></div><div>${registeredContacts.map(c=>{const i=contacts.indexOf(c);return `<div class="contactRow">${av(c.name,c.photo)}<div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.phone)}</div></div><div class="contactActions"><button class="smallBtn" onclick="startChat(${i})">Chat</button><button class="smallBtn" onclick="deleteContact(${i})">Remove</button></div></div>`}).join('')||'<div class="center muted" style="padding:25px">No registered contacts yet.</div>'}</div><button class="btn softbtn" onclick="closeModal();newContact()">＋ New contact</button><button class="btn softbtn" onclick="closeModal();loadPhoneContacts()">📱 Find phone contacts</button>`)}
function deleteContact(i){const c=contacts[i];if(!c)return;const key=c.key;contacts.splice(i,1);chats=chats.filter(x=>x.contactKey!==key);save();closeModal();toast('Contact removed from your account');render()}
function startSelfChat(){const key='self_'+accountStorageKey(profile);let idx=chats.findIndex(x=>x.self===true||x.contactKey===key);if(idx<0){chats.push({self:true,contactKey:key,name:'You',phone:profile.phone||'',photo:profile.photo||'',messages:[]});idx=chats.length-1}else{chats[idx].name='You';chats[idx].photo=profile.photo||''}save();closeModal();openChat(idx)}
function startChat(i){let c=contacts[i];if(!c||!c.registered){toast('Only registered G Messenger users can be added to chats');return}let idx=chats.findIndex(x=>x.contactKey===c.key);if(idx<0){chats.push({contactKey:c.key,name:c.name,phone:c.phone,photo:c.photo||'',messages:[]});idx=chats.length-1}save();closeModal();openChat(idx)}
function attachmentMarkup(m){if(!m)return '';if(m.mime&&m.mime.startsWith('image/')&&m.image)return `<img class="previewImg" src="${m.image}" alt="${esc(m.fileName||'Image')}">`;if(m.mime==='application/pdf'&&m.image)return `<div class="filePreview"><iframe src="${m.image}" title="${esc(m.fileName||'PDF')}"></iframe><div class="fileName">📄 ${esc(m.fileName||'PDF document')}</div></div>`;if(m.image)return `<div class="filePreview"><div class="fileIcon">📎</div><div class="fileName">${esc(m.fileName||m.text||'Attachment')}</div><div class="fileMeta">${esc(m.mime||'File')}</div></div>`;return ''}
function openChat(i){const c=chats[i];if(!c)return render();const self=c.self===true,global=c.global===true;const title=self?'You':c.name;const subtitle=self?'You / yourself':global?'Official G Messenger group':'online';const actions=global?'':'<button onclick="voiceCall('+i+')">☎</button><button onclick="videoCall('+i+')">▣</button>';const canSend=!global||GLOBAL_ADMIN_IDS.includes(String(profile?.id||'').toLowerCase());document.getElementById('app').innerHTML=`<div id="chatScreen" class="chat"><div class="chatHead"><button onclick="render()">‹</button>${av(title,c.photo)}<div class="grow"><div class="name">${esc(title)}${global?' <span class="badge" style="display:inline-flex;margin-left:5px;width:18px;height:18px">✓</span>':''}</div><div class="sub">${esc(subtitle)}</div></div>${actions}<button onclick="chatOptions(${i})">⋮</button></div><div id="body" class="chatBody">${global?'<div class="card" style="text-align:center;margin:0 0 12px"><b>G Messenger General</b><div class="sub">Every verified G Messenger user can see official messages here.</div></div>':''}<span class="date">Today</span>${c.messages.map((m,mi)=>`<div class="bubbleMsg ${m.mine?'out':'in'}" onclick="messageMenu(${i},${mi})">${attachmentMarkup(m)}${m.text&&!m.image?esc(m.text):''}<div class="meta">${esc(m.time||'now')} ${m.mine?'✓✓':''}</div></div>`).join('')}</div>${canSend?`<div class="compose"><button class="round iconbtn" onclick="attachToChat(${i})">📎</button><input id="msg" placeholder="Message" onkeydown="if(event.key==='Enter')sendMsg(${i})"><button class="round send" onclick="sendMsg(${i})">➤</button><button class="round iconbtn" onclick="recordVoice()">🎙</button></div>`:`<div class="card" style="margin:0;border-radius:0;text-align:center"><b>Official group</b><div class="sub">Only G Messenger admins can post messages here.</div></div>`}</div>`;setTimeout(()=>{const b=document.getElementById('body');if(b)b.scrollTop=b.scrollHeight},20)}
function now(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}
function sendMsg(i){const c=chats[i],x=document.getElementById('msg'),t=x&&x.value.trim();if(!c||!t)return;if(c.global&&!GLOBAL_ADMIN_IDS.includes(String(profile?.id||'').toLowerCase()))return toast('Only G Messenger admins can post here');c.messages.push({mine:true,text:t,time:now()});save();openChat(i)}
function attachToChat(i){modal(`<h2>Attachments <button class="x" onclick="closeModal()">✕</button></h2><div class="card"><button class="btn softbtn" onclick="document.getElementById('chatFile').click()">📷 Photo / Video / File</button><input id="chatFile" type="file" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" style="display:none" onchange="attachPicked(${i},this)"><div class="sub">Choose a file from your phone.</div></div>`)}
function attachPicked(i,input){const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{chats[i].messages.push({mine:true,text:f.name,fileName:f.name,mime:f.type||'application/octet-stream',image:rd.result,time:now()});save();closeModal();openChat(i)};rd.readAsDataURL(f)}
function recordVoice(){if(window.Android){Android.requestMicrophone();toast('Microphone permission requested')}else toast('Microphone is unavailable in this browser')}
function voiceCall(i){const c=chats[i];if(c.self){toast('This is your own chat');return}calls.unshift({name:c.name,phone:c.phone,type:'voice',time:now()});save();if(window.Android)Android.call(c.phone);else location.href='tel:'+c.phone}
function videoCall(i){const c=chats[i];if(c.self){toast('This is your own chat');return}calls.unshift({name:c.name,phone:c.phone,type:'video',time:now()});save();if(window.GMBackend&&GMBackend.startVideoCall){GMBackend.startVideoCall(c);return}modal(`<h2>Video call <button class="x" onclick="closeModal()">✕</button></h2><div class="center" style="padding:25px">${av(c.name,c.photo)}<h2>${esc(c.name)}</h2><p class="muted">Video calling is in local mode.</p><button class="callNow" onclick="closeModal()">✕</button><div class="sub">Connect Firebase in v24 to enable internet WebRTC calling.</div></div>`);if(window.Android){Android.requestCamera();Android.requestMicrophone()}}
function chatOptions(i){modal(`<h2>Chat options <button class="x" onclick="closeModal()">✕</button></h2><button class="btn softbtn" onclick="clearChat(${i})">Clear chat</button><button class="btn softbtn" onclick="chatSettings(${i})">Chat settings</button><button class="btn softbtn" onclick="closeModal();toast('Chat muted on this device')">Mute notifications</button><button class="btn danger" onclick="deleteChat(${i})">Delete chat</button>`)}
function deleteChat(i){chats.splice(i,1);save();closeModal();render()}
function messageMenu(i,mi){const m=chats[i]?.messages?.[mi];if(!m)return;modal(`<h2>Message <button class="x" onclick="closeModal()">✕</button></h2><button class="btn softbtn" onclick="editMessage(${i},${mi})">Edit</button><button class="btn softbtn" onclick="forwardMessage(${i},${mi})">Forward</button><button class="btn danger" onclick="deleteMessage(${i},${mi})">Delete</button>`)}
function deleteMessage(i,mi){chats[i].messages.splice(mi,1);save();closeModal();openChat(i)}
function editMessage(i,mi){const m=chats[i].messages[mi];closeModal();modal(`<h2>Edit message <button class="x" onclick="closeModal()">✕</button></h2><div class="field"><label>Message</label><textarea id="editMsg">${esc(m.text||'')}</textarea></div><button class="btn primary" onclick="saveEditedMessage(${i},${mi})">Save</button>`)}
function saveEditedMessage(i,mi){const t=document.getElementById('editMsg').value.trim();if(!t)return toast('Message cannot be empty');chats[i].messages[mi].text=t;chats[i].messages[mi].edited=true;save();closeModal();openChat(i)}
function forwardMessage(i,mi){const m=chats[i].messages[mi];const opts=chats.map((c,j)=>`<div class="contactRow"><div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(m.text||'Attachment')}</div></div><button class="smallBtn" onclick="doForward(${i},${mi},${j})">Send</button></div>`).join('');modal(`<h2>Forward message <button class="x" onclick="closeModal()">✕</button></h2>${opts||'<div class="center muted" style="padding:20px">No other chats yet.</div>'}`)}
function doForward(from,mi,to){const m=chats[from].messages[mi];chats[to].messages.push({mine:true,text:m.text||'',image:m.image||'',time:now(),forwarded:true});save();closeModal();toast('Message forwarded')}
function clearChat(i){chats[i].messages=[];save();closeModal();openChat(i)}
function chatSettings(i){modal(`<h2>Chat settings <button class="x" onclick="closeModal()">✕</button></h2><div class="settingsRow"><div class="settingsIcon">🔔</div><div><b>Notifications</b><span>Message notifications for this chat</span></div></div><div class="settingsRow"><div class="settingsIcon">🖼</div><div><b>Wallpaper</b><span>Chat background</span></div></div><button class="btn softbtn" onclick="closeModal();toast('Chat settings saved')">Done</button>`)}
function updatesView(){const stories=statuses.slice(0,8).map((s,i)=>`<div class="story" onclick="viewStatus(${i})"><div class="ring"><div class="inner"><div>${s.image?`<img src="${s.image}">`:'+'}</div></div></div><b>${esc(s.mine?'My status':s.name)}</b></div>`).join('');const ch=channels.map((c,i)=>`<div class="row"><div class="av">${esc(c.name.slice(0,1))}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.last||'Welcome to G Messenger')}</div></div><div class="time">${esc(c.time||'now')}</div></div>`).join('');return `<div class="app">${header('Updates')}<div class="section"><div class="sectionTitle">Status</div></div><div class="storyStrip"><div class="story" onclick="addStatus()"><div class="ring"><div class="inner"><div>＋</div></div></div><b>Add status</b></div>${stories}</div><div class="section"><div class="sectionTitle">Channels <button class="smallBtn" onclick="newChannel()">Explore</button></div>${ch||'<div class="card muted">Find channels to follow. Your channels will appear here.</div>'}</div><button class="fab" onclick="addStatus()">📷</button>${nav()}</div>`}
function addStatus(){modal(`<h2>Add status <button class="x" onclick="closeModal()">✕</button></h2><div class="actionStrip"><button class="action" onclick="statusText()"><div class="circle">✎</div><b>Text</b></button><button class="action" onclick="toast('Music selector ready')"><div class="circle">♫</div><b>Music</b></button><button class="action" onclick="toast('Layout selector ready')"><div class="circle">▦</div><b>Layout</b></button><button class="action" onclick="statusVoice()"><div class="circle">🎙</div><b>Voice</b></button></div><div class="card"><button class="btn softbtn" onclick="document.getElementById('statusFile').click()">📷 Camera / Gallery</button><input id="statusFile" type="file" accept="image/*" capture="environment" style="display:none" onchange="statusImage(this)"><div class="field"><label>Caption</label><textarea id="statusCaption" placeholder="Write a status update"></textarea></div></div><button class="btn primary" onclick="saveStatus()">Post status</button>`)}
function statusText(){closeModal();modal(`<h2>Text status <button class="x" onclick="closeModal()">✕</button></h2><div class="field"><label>Your status</label><textarea id="textStatus" placeholder="Type a status update"></textarea></div><button class="btn primary" onclick="saveTextStatus()">Post status</button>`)}
function saveTextStatus(){const t=document.getElementById('textStatus').value.trim();if(!t)return toast('Write something first');statuses.unshift({mine:true,name:profile.name,text:t,time:'now',image:''});save();closeModal();render()}
function statusImage(input){const f=input.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{document.getElementById('statusFile').dataset.image=rd.result;toast('Photo selected')};rd.readAsDataURL(f)}
function saveStatus(){const t=document.getElementById('statusCaption').value.trim(),img=document.getElementById('statusFile').dataset.image||'';if(!t&&!img)return toast('Add text or a picture');statuses.unshift({mine:true,name:profile.name,text:t||'Photo',time:'now',image:img});save();closeModal();render()}
function statusVoice(){if(window.Android){Android.requestMicrophone();toast('Microphone permission requested for voice status')} }
function newChannel(){modal(`<h2>New channel <button class="x" onclick="closeModal()">✕</button></h2><div class="field"><label>Channel name</label><input id="chName" placeholder="Enter channel name"></div><div class="field"><label>Description</label><textarea id="chDesc" placeholder="What is this channel about?"></textarea></div><button class="btn primary" onclick="saveChannel()">Create channel</button>`)}
function saveChannel(){let n=chName.value.trim();if(!n)return toast('Enter a channel name');channels.unshift({name:n,last:chDesc.value.trim()||'Channel created',time:'now'});save();closeModal();render()}
function communitiesView(){const list=communities.map(c=>`<div class="row"><div class="av">${esc(c.name.slice(0,1))}</div><div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.desc||'Announcements')}</div></div><div class="time">${esc(c.time||'now')}</div></div>`).join('');return `<div class="app">${header('Communities')}<div class="section"><div class="card"><b>Communities</b><div class="sub">Bring groups and conversations together.</div></div></div><div class="list">${list||'<div class="center muted" style="padding:35px">Your communities will appear here.</div>'}</div><button class="fab" onclick="newCommunity()">＋</button>${nav()}</div>`}
function newCommunity(){modal(`<h2>New community <button class="x" onclick="closeModal()">✕</button></h2><div class="field"><label>Community name</label><input id="comName" placeholder="Name your community"></div><div class="field"><label>Description (optional)</label><textarea id="comDesc" placeholder="Tell people what this community is about"></textarea></div><button class="btn primary" onclick="saveCommunity()">Create</button>`)}
function saveCommunity(){let n=comName.value.trim();if(!n)return toast('Enter a community name');communities.unshift({name:n,desc:comDesc.value.trim(),time:'now',groups:[]});save();closeModal();render()}
function callsView(){const list=calls.map(c=>`<div class="row" onclick="${c.type==='voice'?`callNumber('${esc(c.phone)}')`:`videoNumber('${esc(c.phone)}')`}">${av(c.name)}<div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${c.type==='video'?'▣ Video call':'↗ Voice call'} · ${esc(c.time)}</div></div><div>☎</div></div>`).join('');return `<div class="app">${header('Calls',false)}<div class="section"><div class="callGrid"><button class="callAction" onclick="pickCall()"><span class="ic">☎</span><b>Call</b></button><button class="callAction" onclick="toast('Call link created')"><span class="ic">🔗</span><b>New call link</b></button><button class="callAction" onclick="newContact()"><span class="ic">👤＋</span><b>New contact</b></button><button class="callAction" onclick="openKeypad()"><span class="ic">⌨</span><b>Keypad</b></button></div><div class="sectionTitle">Recent</div></div><div class="list">${list||'<div class="center muted" style="padding:35px">No recent calls.</div>'}</div><button class="fab" onclick="pickCall()">☎</button>${nav()}</div>`}
function pickCall(){const callContacts=contacts.filter(c=>c.registered);modal(`<h2>Start a call <button class="x" onclick="closeModal()">✕</button></h2>${callContacts.map(c=>{const i=contacts.indexOf(c);return `<div class="contactRow">${av(c.name,c.photo)}<div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.phone)}</div></div><button class="smallBtn" onclick="closeModal();callContact(${i})">☎</button></div>`}).join('')||'<div class="center muted" style="padding:25px">Add a registered contact first.</div>'}`)}
function callContact(i){const c=contacts[i];calls.unshift({name:c.name,phone:c.phone,type:'voice',time:now()});save();if(window.Android)Android.call(c.phone)}
function openKeypad(){let d='';modal(`<h2>Keypad <button class="x" onclick="closeModal()">✕</button></h2><div id="dial" class="dial">&nbsp;</div><div class="dialGrid">${['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>`<button class="key" onclick="document.getElementById('dial').textContent+='${n}'">${n}${['2','3','4','5','6','7','8','9'].includes(n)?`<small>${{2:'ABC',3:'DEF',4:'GHI',5:'JKL',6:'MNO',7:'PQRS',8:'TUV',9:'WXYZ'}[n]}</small>`:''}</button>`).join('')}</div><button class="callNow" onclick="callNumber(document.getElementById('dial').textContent)">☎</button>`)}
function callNumber(n){if(!n||n==='&nbsp;')return toast('Enter a number');calls.unshift({name:n,phone:n,type:'voice',time:now()});save();if(window.Android)Android.call(n)}
function videoNumber(n){modal(`<h2>Video call <button class="x" onclick="closeModal()">✕</button></h2><div class="center" style="padding:35px"><div class="logoBig"><img src="gm_logo.png" alt="G Messenger logo"></div><h2>${esc(n)}</h2><p class="muted">Video calling screen is ready.</p><button class="callNow" onclick="closeModal()">✕</button><div class="sub">A real internet video call needs a signaling/backend service connecting both devices.</div></div>`);if(window.Android){Android.requestCamera();Android.requestMicrophone()}}
function newContact(){modal(`<h2>New contact <button class="x" onclick="closeModal()">✕</button></h2><div class="logoBig">👤</div><div class="field"><label>Full name</label><input id="ctName" placeholder="Enter full name"></div><div class="field"><label>Phone number</label><input id="ctPhone" inputmode="tel" placeholder="Enter phone number"></div><div class="field"><label>G Messenger ID (optional)</label><input id="ctId" placeholder="Enter G Messenger ID"></div><button class="btn primary" onclick="saveContact()">Save contact</button><button class="btn softbtn" onclick="loadPhoneContacts()">Show phone contacts</button>`)}
function saveContact(){let n=document.getElementById('ctName').value.trim(),p=document.getElementById('ctPhone').value.trim(),id=document.getElementById('ctId').value.trim();if(!n||!p)return toast('Name and phone number are required');const ru=registeredById(id)||registeredByPhone(p);if(!ru)return toast('This person is not registered on G Messenger. Invite them instead.');const key='user_'+(ru.id||normalizePhone(p));if(!contacts.some(c=>c.key===key))contacts.push({key,name:ru.name||n,phone:ru.phone||p,id:ru.id||id,photo:ru.photo||'',registered:true});save();closeModal();toast('Registered contact saved');render()}
function loadPhoneContacts(){if(!window.Android)return toast('Open the Android app to read contacts');let raw=Android.requestContacts();try{const arr=JSON.parse(raw);showPhoneContacts(arr)}catch{toast('Contacts permission requested')}}
window.onAndroidContactsPermissionGranted=()=>{showPhoneContacts(JSON.parse(Android.refreshContacts()||'[]'))}
function showPhoneContacts(arr){modal(`<h2>Phone contacts <button class="x" onclick="closeModal()">✕</button></h2><div class="card"><b>Registered users only</b><div class="sub">You can add a contact to chat only when that person is registered on G Messenger. Everyone else can only be invited.</div></div>${arr.map(c=>{const ru=registeredByPhone(c.phone);return `<div class="contactRow">${av(ru?.name||c.name,ru?.photo||'')}<div class="grow"><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.phone)} · ${ru?'✓ Registered on G Messenger':'Not registered'}</div></div><div class="contactActions">${ru?`<button class="smallBtn" onclick="addRegisteredPhoneContact('${esc(c.name)}','${esc(c.phone)}','${esc(ru.id||'')}','${esc(ru.photo||'')}')">Add</button>`:`<button class="smallBtn" onclick="invite('${esc(c.phone)}')">Invite</button>`}</div></div>`}).join('')||'<div class="center muted" style="padding:25px">No phone contacts found.</div>'}`)}
function addPhoneContact(n,p){const ru=registeredByPhone(p);if(!ru){toast('Not registered on G Messenger. Invite them instead.');return}addRegisteredPhoneContact(n,p,ru.id||'',ru.photo||'')}
function addRegisteredPhoneContact(n,p,id='',photo=''){const ru=registeredByPhone(p)||registeredById(id);if(!ru){toast('Only registered G Messenger users can be added');return}const key='user_'+(ru.id||normalizePhone(p));if(!contacts.some(c=>c.key===key))contacts.push({key,name:ru.name||n,phone:ru.phone||p,id:ru.id||id,photo:ru.photo||photo,registered:true});save();toast('Registered contact added');closeModal();newChat()}
function invite(p){const text='Join me on G Messenger — a private messaging app. Ask me for my G Messenger ID.';if(window.Android)Android.sms(p,text);else toast('Invite ready')}
function openSettings(){modal(`<h2>Settings <button class="x" onclick="closeModal()">✕</button></h2><div class="card" onclick="closeModal();profileEdit()">${av(profile.name,profile.photo)}<div style="margin-top:8px"><b>${esc(profile.name||'Your profile')}</b><div class="sub">${esc(profile.about||'Hey there! I am using G Messenger.')}</div><div class="sub">${esc(profile.id||'gm_user')}</div></div></div>${[['👤','Account','Security, phone number and profile'],['🔒','Privacy','Block contacts and disappearing messages'],['💬','Chats','Theme, wallpapers, chat history'],['🔔','Notifications','Message, group and call tones'],['💾','Storage and data','Network usage and downloads'],['✦','Gemma AI','On-device assistant settings'],['❓','Help','Help center and contact us']].map(x=>`<div class="settingsRow" onclick="${x[1]==='Gemma AI'?'closeModal();openGemma()':x[1]==='Chats'?'closeModal();chatSettingsHome()':''}"><div class="settingsIcon">${x[0]}</div><div><b>${x[1]}</b><span>${x[2]}</span></div><div class="arrow">›</div></div>`).join('')}<div class="settingsRow"><div class="settingsIcon">💳</div><div style="flex:1"><b>Plans</b><span>Mobile data saver</span></div><div class="arrow">›</div></div><div class="plan selected"><b>Free plan</b><div class="price">₦0</div><div class="sub">Super mobile data saver</div><button class="btn softbtn" onclick="selectPlan('free')">Use free plan</button></div><div class="plan"><b>Ultra — 2 weeks</b><div class="price">₦500</div><div class="sub">Ultra mobile data saver</div><button class="btn softbtn" onclick="payPlan('2weeks','₦500')">Choose plan</button></div><div class="plan"><b>Ultra — 1 month</b><div class="price">₦1,000</div><div class="sub">Ultra mobile data saver</div><button class="btn primary" onclick="payPlan('1month','₦1,000')">Choose plan</button></div><div class="card"><b>Payment instructions</b><div class="sub">Opay · 9033229734</div><div class="sub">After payment, keep your receipt and use the confirmation flow.</div></div><button class="btn softbtn" onclick="toggleTheme();closeModal();render()">Toggle light / dark theme</button><button class="btn danger" onclick="logout()">Log out</button>`)}
function payPlan(plan,price){modal(`<h2>Activate ${esc(plan)} <button class="x" onclick="closeModal()">✕</button></h2><div class="card"><b>${price} mobile data saver plan</b><div class="sub">Pay to Opay · 9033229734</div></div><div class="field"><label>Payment reference</label><input id="payRef" placeholder="Enter your receipt/reference"></div><button class="btn primary" onclick="submitPayment('${esc(plan)}','${esc(price)}')">I have paid</button><div class="sub center" style="margin-top:10px">Activation can be verified manually. This build does not process or verify payments automatically.</div>`)}
function submitPayment(plan,price){const r=document.getElementById('payRef').value.trim();if(!r)return toast('Enter payment reference');localStorage.setItem(K+'pendingPlan',plan);localStorage.setItem(K+'paymentRef',r);closeModal();toast('Payment reference saved for review')}
function selectPlan(p){localStorage.setItem(K+'plan',p);closeModal();toast('Free plan selected')}
function chatSettingsHome(){toast('Chat settings are available inside each chat')}
function profileEdit(){modal(`<h2>Profile <button class="x" onclick="closeModal()">✕</button></h2><div class="center"><div class="logoBig">${profile.photo?`<img style="width:100%;height:100%;object-fit:cover;border-radius:24px" src="${profile.photo}">`:`<img style="width:100%;height:100%;object-fit:cover;border-radius:24px" src="gm_logo.png" alt="G Messenger logo">`}</div><button class="btn softbtn" onclick="document.getElementById('profilePhoto').click()">📷 Change profile photo</button><input id="profilePhoto" type="file" accept="image/*" style="display:none" onchange="profilePhotoPicked(this)"></div><div class="field"><label>Name</label><input id="pfName" value="${esc(profile.name||'')}" placeholder="Your name"></div><div class="field"><label>About</label><textarea id="pfAbout">${esc(profile.about||'Hey there! I am using G Messenger.')}</textarea></div><div class="field"><label>G Messenger ID</label><input id="pfId" value="${esc(profile.id||'')}" placeholder="Choose your G Messenger ID"></div><button class="btn primary" onclick="saveProfile()">Save profile</button>`)}
function profilePhotoPicked(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{profile.photo=r.result;profileEdit()};r.readAsDataURL(f)}
function saveProfile(){profile.name=document.getElementById('pfName').value.trim()||'G Messenger user';profile.about=document.getElementById('pfAbout').value.trim();profile.id=document.getElementById('pfId').value.trim()||('gm_'+Math.random().toString(36).slice(2,9));save();syncCurrentUserToRegistry();closeModal();render()}
function openGemma(){const ready=window.Android&&Android.gemmaAvailable&&Android.gemmaAvailable()==='true';modal(`<div class="ai"><div class="aiTop"><div class="aiLogo">✦</div><div class="grow"><h2 style="margin:0">Gemma AI</h2><div class="sub">${ready?'On-device Gemma model ready':'On-device Gemma model not loaded'}</div></div><button class="x" onclick="closeModal()">✕</button></div>${ready?'':'<button class="btn softbtn" onclick="Android&&Android.pickGemmaModel&&Android.pickGemmaModel()">Import Gemma .task model</button><div class="sub" style="margin:8px 0">Use a compatible MediaPipe Gemma Task Bundle. The model runs locally on the phone.</div>'}<div class="aiQuick"><button onclick="quickAI('Summarize')">Summarize</button><button onclick="quickAI('Explain')">Explain</button><button onclick="quickAI('Rewrite')">Rewrite</button><button onclick="quickAI('Translate')">Translate</button></div><div id="aimsgs" class="aiMsgs"><div class="aim bot">Hello! I’m Gemma AI. Ask me something or choose an action.</div></div><div class="aiBar"><input id="aiInput" placeholder="Ask Gemma AI…" onkeydown="if(event.key==='Enter')sendAI()"><button onclick="sendAI()">➤</button></div></div>`)}
function quickAI(action){const x=document.getElementById('aiInput');if(!x)return;const prefix={Summarize:'Summarize the following text concisely:\n\n',Explain:'Explain the following clearly for a beginner:\n\n',Rewrite:'Rewrite the following to be clearer while preserving its meaning:\n\n',Translate:'Translate the following text into English:\n\n'}[action]||'';x.value=prefix;x.focus();try{x.setSelectionRange(x.value.length,x.value.length)}catch(e){}}
let gmAiCounter=0;
window.gmAiPending=window.gmAiPending||{};
window.onGemmaResult=function(callbackId,result){const id=window.gmAiPending[callbackId]||callbackId;const e=document.getElementById(id);if(e){let text=String(result??'').replace(/\\r?\\n/g,'\n').trim();if(result==='MODEL_NOT_READY')text='Import a compatible Gemma .task model first.';else if(result==='EMPTY_PROMPT')text='Please enter a request for Gemma AI.';else if(!text)text='I couldn\'t generate a response. Please try again.';e.textContent=text;e.dataset.done='1';const box=document.getElementById('aimsgs');if(box)box.scrollTop=box.scrollHeight}delete window.gmAiPending[callbackId]};
function sendAI(){const x=document.getElementById('aiInput'),q=x&&x.value.trim();if(!q)return;const box=document.getElementById('aimsgs');if(!box)return;box.insertAdjacentHTML('beforeend',`<div class="aim user">${esc(q)}</div>`);x.value='';const id='ai_'+(++gmAiCounter);window.gmAiPending[id]=id;box.insertAdjacentHTML('beforeend',`<div id="${id}" class="aim bot">Thinking…</div>`);box.scrollTop=box.scrollHeight;const native=window.Android&&Android.gemmaAvailable&&Android.gemmaAvailable()==='true';if(native){try{Android.generateGemma(q,id)}catch(e){const el=document.getElementById(id);if(el)el.textContent='Gemma AI could not start this request. Please try again.';delete window.gmAiPending[id]}return}const l=q.toLowerCase();let r;if(l.includes('summar'))r='Import a compatible Gemma .task model to run this request fully on-device.';else if(l.includes('explain'))r='Import a compatible Gemma .task model to get an on-device explanation.';else if(l.includes('rewrite'))r='Import a compatible Gemma .task model to rewrite text locally.';else if(l.includes('translat'))r='Import a compatible Gemma .task model to translate locally.';else r='Open Gemma AI and import a compatible .task model to answer this request on-device.';document.getElementById(id).textContent=r;box.scrollTop=box.scrollHeight}
function onGemmaModelChanged(ok){if(document.getElementById('modal')){closeModal();openGemma()}}

function viewStatus(i){const s=statuses[i];if(!s)return;modal(`<div class="statusViewer">${s.image?`<img src="${s.image}" style="width:100%;max-height:60vh;object-fit:contain;border-radius:18px;background:#000">`:''}<h2>${esc(s.mine?'My status':s.name)} <button class="x" onclick="closeModal()">✕</button></h2><p style="font-size:17px;line-height:1.5">${esc(s.text||'')}</p><div class="sub">${esc(s.time||'now')}</div></div>`)}
function logout(){save();localStorage.removeItem(K+'profile');localStorage.removeItem(K+'verified');profile=null;verified=false;accountKey='';contacts=[];chats=[];closeModal();render()}
function modal(c){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="handle"></div>${c}</div></div>`)}function closeModal(){document.getElementById('modal')?.remove()}
function toggleTheme(){dark=!dark;document.body.classList.toggle('dark',dark);save()}
function showRegistration(){document.getElementById('app').innerHTML=profile?verificationView():registerView()}
function registerView(){return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><div class="card" style="width:100%;max-width:480px;text-align:center"><div class="logoBig"><img src="gm_logo.png" alt="G Messenger logo"></div><h1 style="color:var(--blue);margin:0">G Messenger</h1><p class="sub">Private messaging. Simple. Connected.</p><div class="field" style="text-align:left"><label>Name</label><input id="regName" placeholder="Enter your name"></div><div class="field" style="text-align:left"><label>Phone number</label><input id="regPhone" inputmode="tel" placeholder="+234..."></div><div class="field" style="text-align:left"><label>G Messenger ID</label><input id="regId" placeholder="Choose your ID"></div><button class="btn primary" onclick="registerContinue()">Continue</button><div class="sub" style="margin-top:10px">Your profile is stored on this device until you sign out/reset app data.</div></div></div>`}
function registerContinue(){const n=document.getElementById('regName').value.trim(),p=document.getElementById('regPhone').value.trim(),id=document.getElementById('regId').value.trim()||('gm_'+Math.random().toString(36).slice(2,9));if(!n||!p)return toast('Enter your name and phone number');profile={name:n,phone:p,id,about:'Hey there! I am using G Messenger.',photo:''};verified=false;loadAccountData(false);save();showRegistration()}
function verificationView(){return `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><div class="card" style="width:100%;max-width:480px;text-align:center"><div class="logoBig"><img src="gm_logo.png" alt="G Messenger logo"></div><h1>Verify your number</h1><p class="sub">We sent a verification code to ${esc(profile.phone)}</p><div class="field"><label>Verification code</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit code"></div><button class="btn primary" onclick="verifyCode()">Verify</button><button class="btn softbtn" onclick="profile=null;verified=false;localStorage.removeItem(K+'profile');render()">Use a different number</button><div class="sub" style="margin-top:10px">Prototype verification code: 123456</div></div></div>`}
function verifyCode(){if(document.getElementById('otp').value!=='123456')return toast('Incorrect code');verified=true;localStorage.setItem(K+'verified','1');save();syncCurrentUserToRegistry();render()}
render();
</script><script src="firebase-config.js"></script><script src="backend.js"></script></body></html>
